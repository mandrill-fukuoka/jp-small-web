name: 検索画面の休止を防ぐ

on:
  schedule:
    - cron: "23 */6 * * *"   # 6時間ごと
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: 検索画面を開く（休止していれば起動）
        run: python scripts/keepalive.py

      - name: 失敗時の画面を保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keepalive-screenshot
          path: keepalive.png
